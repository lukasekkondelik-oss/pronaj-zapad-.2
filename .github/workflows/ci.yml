name: CI
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Sestavení webu (ukázková data)
        run: USE_SAMPLE=1 python3 tools/build.py
      - name: Kontrola JS administrace
        run: node --check static/admin/admin.js && node --check static/assets/podklady.js
      - name: Testy API
        run: node --test tests/api.test.js
      - name: Testy zpracování Softrealu
        run: python3 tests/softreal.test.py
