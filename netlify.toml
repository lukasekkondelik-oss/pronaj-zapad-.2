# Záložní konfigurace: web běží na Vercelu (vercel.json). Tento soubor Vercel ignoruje
# a využije se, jen pokud se hosting přepne na Netlify (viz docs/SETUP.md).
[build]
  command = "python3 tools/build.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.11"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
