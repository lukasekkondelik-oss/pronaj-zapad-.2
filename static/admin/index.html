<!doctype html>
<html lang="cs"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Správa nabídek | Pronájmy Západ</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css">
<style>
body{background:var(--cream)}
.top{background:var(--navy);color:#fff;padding:14px 0}.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px}
.top b{font:500 1.15rem var(--serif);letter-spacing:.05em;text-transform:uppercase}
.box{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px;margin:28px 0}
.login{max-width:420px;margin:60px auto}
table.l{width:100%;border-collapse:collapse;font-size:.95rem}
table.l th,table.l td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.l img{width:64px;height:44px;object-fit:cover;border-radius:6px;background:var(--cream-2)}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:600}
.b-published{background:#e6f3ec;color:var(--ok)}.b-draft{background:#fff3d6;color:#8a6200}.b-archived{background:#eee;color:#666}.b-rented{background:#e4e9f3;color:#2a4a86}
.btn.out{background:#fff;border:1px solid var(--line);color:var(--navy)}
.btn.danger{background:#fff;border:1px solid #e0b4b0;color:var(--err)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chips label{display:inline-flex;gap:6px;align-items:center;font-weight:500;background:var(--cream);border:1px solid var(--line);border-radius:999px;padding:6px 12px;margin:0;cursor:pointer}
.chips input{width:auto}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:12px 0}
.ph figure{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;position:relative}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover}
.ph .bar{display:flex;gap:4px;padding:6px;justify-content:space-between}
.ph button{border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;padding:3px 9px}
.ph .cover{position:absolute;top:6px;left:6px;background:var(--gold);color:var(--navy);font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:18px}
.hint{color:var(--muted);font-size:.85rem;margin:4px 0 0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;display:none;z-index:99;max-width:90vw}
@media(max-width:720px){.g3,.g2{grid-template-columns:1fr}table.l .hm{display:none}}
</style></head><body>
<div class="top"><div class="wrap"><b>Pronájmy Západ · Správa nabídek</b><span id="who"></span></div></div>
<main class="wrap" id="app"><p style="padding:40px 0">Načítám…</p></main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/admin/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/admin/admin.js"></script>
</body></html>
